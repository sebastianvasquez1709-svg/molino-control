<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Molino Control</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--navy:#0b2d63;--blue:#1769d2;--bg:#f3f6fa;--card:#fff;--text:#152238;--muted:#667085;--line:#dce4ee;--green:#087443;--red:#b42318;--amber:#9a6700}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer}
.auth-locked{overflow:hidden}.auth-locked #app{display:none!important}.auth-unlocked #login{display:none!important}.auth-unlocked #app{display:flex!important}
#login{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#edf4ff,#f8fafc)}
.loginbox{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 20px 70px #0b2d6322;text-align:center}.loginlogo{width:220px;height:120px;object-fit:contain}.loginbox h1{margin:8px 0;color:var(--navy)}.loginbox p{color:var(--muted)}.alert{padding:10px;border-radius:9px;margin:10px 0;background:#fff0ee;color:var(--red)}label{display:block;text-align:left;font-size:12px;font-weight:800;color:var(--muted);margin:16px 0 6px}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.primary{width:100%;margin-top:16px;background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:10px;padding:12px;font-weight:800}.remember{display:flex;gap:8px;align-items:center;text-align:left;margin-top:12px;font-size:12px;color:var(--muted)}.remember input{width:auto}
#app{min-height:100vh}.side{width:250px;position:fixed;inset:0 auto 0 0;background:var(--navy);color:#fff;padding:16px 13px;overflow:auto}.brand{display:flex;gap:10px;align-items:center;padding:6px 6px 18px}.brand img{width:54px;height:45px;object-fit:contain;background:#fff;border-radius:8px}.brand b{display:block;font-size:18px}.brand small{display:block;color:#cbdcff;font-size:10px;margin-top:2px}.nav button{width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:11px 12px;border-radius:9px;font-weight:800;margin:2px 0}.nav button:hover,.nav .active{background:#ffffff1f}.logout{position:absolute;left:13px;right:13px;bottom:15px}.logout button{width:100%;padding:11px;border:1px solid #fff3;background:#fff;color:var(--navy);border-radius:10px;font-weight:800}
main{margin-left:250px;width:calc(100% - 250px)}.top{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:10}.top h2{margin:0}.profile{font-size:12px;color:var(--muted);text-align:right}.content{padding:25px;max-width:1500px}.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:17px;padding:25px;display:flex;justify-content:space-between;align-items:center}.hero h1{margin:6px 0;font-size:30px}.hero p{color:#dce9ff;max-width:700px}.heroicon{font-size:56px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:16px 0}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 6px 20px #0b2d6308}.metric small{display:block;color:var(--muted);font-weight:800;font-size:10px}.metric strong{display:block;font-size:25px;margin-top:4px}.section{margin-top:18px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;padding:11px 15px;font-weight:800}.btn.primary{width:auto;margin:0}.notice{padding:12px;background:#eef5ff;color:var(--blue);border-radius:10px;margin:10px 0;font-size:13px}.danger{background:#fff0ee;color:var(--red)}.security{background:#f8fbff}.drop{border:2px dashed #9fb4d1;padding:30px;text-align:center;border-radius:14px;margin-top:15px}.tablewrap{overflow:auto;max-height:65vh;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:9px;border-bottom:1px solid #edf1f5;text-align:left;font-size:12px}.table th{background:#f7f9fc;position:sticky;top:0}.search{display:grid;grid-template-columns:1fr 180px;gap:8px;margin:12px 0}.modalbg{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:10000;padding:20px}.modal{width:min(900px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.detail{padding:8px 0;border-bottom:1px solid #edf1f5}.muted{color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef5ff;color:var(--blue);font-size:11px;font-weight:800}
@media(max-width:900px){.side{display:none}main{margin-left:0;width:100%}.grid{grid-template-columns:repeat(2,1fr)}.top{padding:0 14px}.content{padding:15px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body class="auth-locked">
<div id="login" aria-hidden="false">
  <div class="loginbox">
    <img class="loginlogo" src="logo molino.jpg" alt="Molinos San Miguel">
    <h1>Molino Control</h1>
    <p>Acceso al sistema</p>
    <div class="alert">🔐 Sistema protegido</div>
    <label for="rut">RUT / Usuario</label>
    <input id="rut" autocomplete="username" placeholder="18.446.726-7">
    <label for="pin">Clave</label>
    <input id="pin" type="password" autocomplete="current-password" inputmode="numeric" placeholder="••••">
    <label class="remember"><input id="remember" type="checkbox"> Recordar usuario en este equipo</label>
    <button id="loginBtn" class="primary" type="button">Entrar al sistema</button>
    <div id="msg" aria-live="polite"></div>
    <p style="font-size:10px;margin-top:14px">Clave de esta versión: 1234</p>
  </div>
</div>
<div id="app" aria-hidden="true">
  <aside class="side">
    <div class="brand"><img src="logo molino.jpg" alt="Logo"><div><b>Molino Control</b><small>Molinos San Miguel LTDA</small></div></div>
    <nav class="nav">
      <button data-view="dashboard">📊 Panel Macro</button>
      <button data-view="maestro">📥 Maestro Excel</button>
      <button data-view="indicadores">📈 Indicadores privados</button>
      <button data-view="documentos">🧾 Documentos</button>
      <button data-view="clientes">👥 Clientes</button>
      <button data-view="despachos">🚚 Despachos</button>
      <button data-view="guias">🛻 Guías</button>
      <button data-view="ncs">📝 NC / ND</button>
      <button data-view="iva">💰 IVA</button>
      <button data-view="admin">⚙️ Administración</button>
    </nav>
    <div class="logout"><button id="logoutBtn" type="button">🚪 Cerrar sesión</button></div>
  </aside>
  <main>
    <header class="top"><h2 id="pageTitle">Panel Macro</h2><div id="profile" class="profile"></div></header>
    <div id="content"></div>
  </main>
</div>
<div id="modal"></div>
<script>
'use strict';
const ADMIN_RUT='184467267', GENERAL_PASSWORD='1234';
let SESSION=null, LAST_FILE=null, IMPORT_PREVIEW=null;
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const num=v=>{const s=String(v??'').trim().replace(/\s/g,'').replace(/\.(?=\d{3}(?:\D|$))/g,'').replace(',','.'); const n=Number(s); return Number.isFinite(n)?n:0};
const fmt=n=>Number(n||0).toLocaleString('es-CL',{maximumFractionDigits:2});
const normRut=v=>String(v||'').toUpperCase().replace(/[.\-\s]/g,'');
const isAdmin=()=>SESSION?.rol==='ADMIN';
const $=id=>document.getElementById(id);
function showMessage(text,kind='danger'){ $('msg').innerHTML=`<div class="notice ${kind==='danger'?'danger':''}">${esc(text)}</div>`; }
function login(){
  const raw=$('rut').value.trim(), rut=normRut(raw), pin=$('pin').value;
  if(!rut){showMessage('Ingresa un RUT o usuario.');$('rut').focus();return;}
  if(pin!==GENERAL_PASSWORD){showMessage('Clave incorrecta.');$('pin').focus();$('pin').select();return;}
  SESSION={rut:raw,rol:rut===ADMIN_RUT?'ADMIN':'OPERADOR'};
  try{ if($('remember').checked)localStorage.setItem('molino_last_rut',raw); else localStorage.removeItem('molino_last_rut'); }catch(e){}
  document.body.classList.remove('auth-locked');document.body.classList.add('auth-unlocked');
  $('login').setAttribute('aria-hidden','true');$('app').setAttribute('aria-hidden','false');$('msg').innerHTML='';$('pin').value='';
  updateProfile();render('dashboard');
}
function logout(){SESSION=null;document.body.classList.remove('auth-unlocked');document.body.classList.add('auth-locked');$('app').setAttribute('aria-hidden','true');$('login').setAttribute('aria-hidden','false');$('pin').value='';$('msg').innerHTML='';$('pin').focus();}
function updateProfile(){ $('profile').innerHTML=SESSION?`<b>${esc(SESSION.rut)}</b><br><span class="pill">${esc(SESSION.rol)}</span>`:''; }
function guardAdmin(){ if(isAdmin())return true; renderDenied(); return false; }
function renderDenied(){ $('pageTitle').textContent='Acceso restringido'; $('content').innerHTML='<div class="content"><div class="card"><h2>🔒 Acceso restringido</h2><p>Esta sección es exclusiva del administrador.</p><div class="notice danger">Ingresa con el RUT administrador para abrirla.</div></div></div>'; }
function render(view){
  if(['maestro','indicadores','admin'].includes(view)&&!guardAdmin())return;
  const titles={dashboard:'Panel Macro',maestro:'Maestro Excel',indicadores:'Indicadores privados',documentos:'Documentos',clientes:'Clientes',despachos:'Despachos',guias:'Guías',ncs:'NC / ND',iva:'IVA y control',admin:'Administración'};
  $('pageTitle').textContent=titles[view]||'Molino Control';
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  const views={dashboard,maestro,indicadores,documentos,clientes,despachos,guias,ncs,iva,admin};
  $('content').innerHTML=(views[view]||dashboard)();updateProfile();
}
function metric(label,value,sub=''){return `<div class="card metric"><small>${esc(label)}</small><strong>${esc(value)}</strong>${sub?`<span class="muted" style="font-size:12px">${esc(sub)}</span>`:''}</div>`;}
function dashboard(){return `<div class="content"><div class="hero"><div><small>MOLINO CONTROL</small><h1>Centro ejecutivo de control</h1><p>Panel privado para administrar el Maestro, revisar información y preparar la actualización mensual desde Softland.</p></div><div class="heroicon">🏭</div></div><div class="section"><h2>Estado del sistema</h2><div class="grid">${metric('ACCESO',SESSION?.rol||'SIN SESIÓN','Sesión actual')}${metric('MAESTRO','Listo','Módulo de carga')}${metric('INE','Privado','Solo administrador')}${metric('SOFTLAND','Preparado','Importación Excel')}</div></div><div class="card section"><h2>🔐 Reglas de acceso</h2><p>La clave general de esta versión es <b>1234</b>. El administrador usa el RUT <b>18.446.726-7</b>. Los demás usuarios entran como operadores con permisos limitados.</p><p class="muted">Esta es una barrera de acceso del prototipo. Para seguridad de producción, la autenticación debe quedar en Supabase.</p></div></div>`;}
function maestro(){return `<div class="content"><div class="card"><h2>📥 Actualizar Maestro</h2><p>Área exclusiva del administrador. Puedes seleccionar el Excel mensual exportado desde Softland.</p><div class="drop"><b>Seleccionar Excel</b><br><small class="muted">.xlsx, .xls o .csv</small><br><input id="excelInput" type="file" accept=".xlsx,.xls,.csv"></div><div id="excelStatus" class="section"></div></div><div class="card section"><h2>Flujo de actualización</h2><div class="actions"><span class="pill">1. Seleccionar</span><span class="pill">2. Validar</span><span class="pill">3. Revisar</span><span class="pill">4. Confirmar</span><span class="pill">5. Publicar</span></div><div class="notice">El archivo original no se modifica. La actualización persistente en Supabase se implementará después de validar el formato definitivo del Maestro.</div></div></div>`;}
async function selectExcel(file){
  if(!file)return;LAST_FILE=file;const out=$('excelStatus');out.innerHTML='<div class="notice">⏳ Leyendo archivo…</div>';
  try{
    const buf=await file.arrayBuffer();
    if(typeof XLSX==='undefined')throw new Error('No se pudo cargar el lector de Excel.');
    const wb=XLSX.read(buf,{type:'array',cellDates:false});
    const sheets=wb.SheetNames||[];let totalRows=0,ine=null,rowsBySheet=[];
    for(const name of sheets){const data=XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:''});totalRows+=data.length;rowsBySheet.push([name,data.length]);if(name.trim().toUpperCase()==='INE')ine=data;}
    IMPORT_PREVIEW={name:file.name,size:file.size,sheets,rows:totalRows,ineRows:ine?ine.length:0,rowsBySheet};
    const rowsHtml=rowsBySheet.map(([n,c])=>`<li>${esc(n)}: <b>${fmt(c)}</b> registros</li>`).join('');
    out.innerHTML=`<div class="notice"><b>✅ Archivo leído:</b> ${esc(file.name)}<br>Tamaño: ${fmt(file.size/1024)} KB<br>Hojas: ${fmt(sheets.length)}<br>Registros leídos: ${fmt(totalRows)}</div><div class="card"><h3>Hojas detectadas</h3><ul>${rowsHtml}</ul><p><b>Hoja INE:</b> ${ine?'✅ Detectada ('+fmt(ine.length)+' filas)':'⚠️ No detectada'}</p><p class="muted">El sistema todavía no publica cambios automáticamente. Primero debemos validar la estructura real del Maestro y las reglas de duplicados.</p></div>`;
  }catch(e){out.innerHTML=`<div class="notice danger">No se pudo leer el archivo: ${esc(e.message||e)}</div>`;}
}
function indicadores(){return `<div class="content"><div class="hero"><div><small>PANEL PRIVADO</small><h1>INE · Sacos · Granel</h1><p>Este bloque es solo para el administrador.</p></div><div class="heroicon">📈</div></div><div class="grid">${metric('INE',IMPORT_PREVIEW?.ineRows?fmt(IMPORT_PREVIEW.ineRows)+' filas':'Pendiente','Se toma desde la hoja INE')}${metric('SACOS','Ver Maestro','Campo SACOS')}${metric('GRANEL','Ver Maestro','Campo S/G = GRANEL')}${metric('FUENTE',IMPORT_PREVIEW?.name||'Sin archivo','Último archivo en esta sesión')}</div><div class="grid2 section"><div class="card"><h2>📊 Promedios INE</h2><p>Se mostrará aquí cuando importemos el Excel Maestro real con la hoja <b>INE</b> y definamos las columnas exactas de cálculo.</p></div><div class="card"><h2>📦 Sacos y Granel</h2><p>La estructura del Maestro contempla <b>SACOS</b> y <b>S/G</b> con clasificación de <b>SACOS / GRANEL</b>.</p><p class="muted">No se inventan valores hasta leer el Excel real.</p></div></div></div>`;}
function documents(){return `<div class="content"><div class="card"><h2>🧾 Documentos</h2><div class="notice">Los documentos reales se mostrarán aquí cuando el Maestro esté conectado a Supabase.</div></div></div>`;}
function clients(){return `<div class="content"><div class="card"><h2>👥 Clientes</h2><div class="notice">El catálogo de clientes se alimentará desde Softland/Supabase.</div></div></div>`;}
function dispatches(){return `<div class="content"><div class="card"><h2>🚚 Despachos</h2><p>Área operativa para próximos despachos.</p><div class="notice">Aquí incorporaremos fecha, cliente, producto, kilos, sacos/granel, adjuntos y estados.</div></div></div>`;}
function guides(){return `<div class="content"><div class="card"><h2>🛻 Guías</h2><div class="notice">Las guías se cargarán desde el Maestro Softland.</div></div></div>`;}
function ncs(){return `<div class="content"><div class="card"><h2>📝 NC / ND</h2><div class="notice">Las notas de crédito y débito se cargarán desde el Maestro Softland.</div></div></div>`;}
function iva(){return `<div class="content"><div class="grid">${metric('IVA','Pendiente','Conexión al Maestro')}${metric('TASA GENERAL','19%','Valor de referencia')}${metric('NETO','Pendiente','Conexión al Maestro')}${metric('TOTAL','Pendiente','Conexión al Maestro')}</div></div>`;}
function admin(){return `<div class="content"><div class="grid2"><div class="card"><h2>👑 Administrador</h2><p>RUT: <b>18.446.726-7</b></p><p>Rol: <b>ADMIN</b></p></div><div class="card"><h2>🔐 Permisos</h2><p>✓ Cargar Excel</p><p>✓ Indicadores privados</p><p>✓ Administración</p><p>✓ Revisar Maestro</p><p>⚠️ La clave 1234 es solo para esta versión de prototipo.</p></div></div><div class="card section"><h2>🔄 Última carga</h2><p>${LAST_FILE?esc(LAST_FILE.name):'No hay carga en esta sesión.'}</p></div></div>`;}

document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.view)));
$('loginBtn').addEventListener('click',login);$('logoutBtn').addEventListener('click',logout);$('pin').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();login()}});$('rut').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('pin').focus()}});$('excelInput')?.addEventListener('change',e=>selectExcel(e.target.files[0]));
try{const saved=localStorage.getItem('molino_last_rut');if(saved)$('rut').value=saved}catch(e){}
$('excelInput');
render('dashboard');
</script>
</body>
</html>
