<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Molino Control</title>
<meta name="description" content="Molino Control — control, indicadores y Maestro Excel">
<style>
:root{--blue:#123a78;--blue2:#1e56a0;--bg:#f4f7fb;--card:#fff;--text:#1d2939;--muted:#667085;--line:#d9e2ef;--green:#0e9f6e;--red:#c93b3b;--amber:#b7791f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
body{overflow-x:hidden}.hidden{display:none!important}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#eef4ff,#f8fbff)}
.loginCard{width:min(560px,96vw);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(18,58,120,.12);padding:34px}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:18px}.brand img{width:74px;height:74px;object-fit:contain;border-radius:10px}.brand h1{margin:0;color:var(--blue);font-size:28px}.brand small{color:var(--muted)}
.badge{padding:10px 14px;border-radius:10px;background:#fff3f1;color:#b42318;font-weight:700;text-align:center;margin:14px 0 20px}
label{display:block;font-weight:700;margin:14px 0 7px}input,select,button{font:inherit}input[type=text],input[type=password],input[type=file],select{width:100%;padding:13px 14px;border:1px solid #c9d6e6;border-radius:10px;background:#fff}input:focus,select:focus{outline:3px solid rgba(30,86,160,.14);border-color:var(--blue2)}
button{border:0;border-radius:10px;padding:12px 16px;cursor:pointer;font-weight:700}.primary{background:var(--blue);color:#fff}.secondary{background:#e9f0fa;color:var(--blue)}.danger{background:#fff1f1;color:#b42318}.ghost{background:transparent;color:var(--blue2);border:1px solid #c7d4e6}
.loginActions{margin-top:18px}.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:14px}.error{color:#b42318;background:#fff1f1;border:1px solid #f3c5c5;border-radius:10px;padding:10px;margin-top:12px;font-size:14px}
#app{min-height:100vh}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--blue);color:#fff;padding:16px 13px;position:sticky;top:0;height:100vh}.sideBrand{display:flex;gap:10px;align-items:center;padding:8px 7px 18px}.sideBrand img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:8px}.sideBrand strong{display:block;font-size:18px}.sideBrand span{display:block;font-size:11px;opacity:.78}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#fff;text-align:left;padding:11px 12px;border-radius:9px}.nav button:hover,.nav button.active{background:rgba(255,255,255,.12)}.logout{position:absolute;left:13px;right:13px;bottom:14px}.logout button{width:100%;background:#fff;color:var(--blue)}
.main{min-width:0}.topbar{background:#fff;border-bottom:1px solid var(--line);padding:17px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;position:sticky;top:0;z-index:5}.topbar h2{margin:0;color:var(--blue);font-size:21px}.userPill{font-size:12px;text-align:right}.userPill strong{display:block}.role{display:inline-block;margin-top:4px;padding:4px 8px;background:#edf5ff;color:var(--blue2);border-radius:999px;font-weight:800}
.content{padding:22px;max-width:1500px;margin:0 auto}.hero{background:linear-gradient(135deg,#123a78,#1e56a0);color:#fff;border-radius:18px;padding:25px;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h1{margin:7px 0;font-size:29px}.hero p{margin:0;opacity:.9}.heroIcon{font-size:56px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.metric small{display:block;color:var(--muted)}.metric strong{display:block;font-size:27px;color:var(--blue);margin-top:5px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 12px}.sectionTitle h3{margin:0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar>*{width:auto}.drop{border:2px dashed #b9c9dd;border-radius:14px;padding:28px;text-align:center;background:#f9fbff}.drop p{color:var(--muted)}
.status{padding:10px 12px;border-radius:10px;margin-top:12px}.status.ok{background:#ecfdf3;color:#067647}.status.warn{background:#fff8eb;color:#9a6700}.status.err{background:#fff1f1;color:#b42318}
.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:520px}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:9px 10px;border-bottom:1px solid #edf1f6;white-space:nowrap;text-align:left;font-size:13px}.table th{background:#f7f9fc;color:#475467;position:sticky;top:0;z-index:1}.muted{color:var(--muted)}.note{font-size:12px;color:var(--muted)}
.kpiRow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.kpi b{display:block;font-size:22px;color:var(--blue);margin-top:4px}
.sheetList{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.sheetTag{padding:6px 9px;border-radius:999px;background:#eef4fb;color:var(--blue);font-size:12px;font-weight:700}
.moduleNav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.moduleNav button{padding:9px 12px}.moduleNav button.active{background:var(--blue);color:white}
.banner{padding:12px 14px;border-radius:10px;background:#edf5ff;color:#123a78;border:1px solid #cbdcf2;margin-bottom:12px}.emptyState{padding:30px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:12px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.kpiRow{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto}.logout{position:static;margin-top:14px}.topbar{position:static}}
@media(max-width:560px){.grid,.kpiRow{grid-template-columns:1fr}.content{padding:14px}.loginCard{padding:22px}}

.clientSearch{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.clientSearch input{flex:1;min-width:240px;padding:11px 12px;border:1px solid var(--line);border-radius:10px}.clientRowBtn{border:0;background:transparent;color:var(--blue);font-weight:800;cursor:pointer;padding:0}.clientRowBtn:hover{text-decoration:underline}.clientFicha{background:#f7fbff;border:1px solid #cfe0f5;border-radius:14px;padding:16px;margin-bottom:14px}.clientFichaHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.clientFicha h4{margin:0;color:var(--blue);font-size:20px}.clientMeta{color:var(--muted);font-size:13px;margin-top:4px}.clientKpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.clientKpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.clientKpi small{display:block;color:var(--muted)}.clientKpi strong{display:block;color:var(--blue);font-size:20px;margin-top:4px}.clientActions{display:flex;gap:8px;flex-wrap:wrap}.clientActions button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--blue);padding:9px 12px;border-radius:9px;font-weight:800}
@media(max-width:900px){.clientKpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="loginScreen">
  <section class="loginCard">
    <div class="brand"><img src="/logo molino.jpg" alt="Molinos San Miguel"><div><h1>Molino Control</h1><small>Molinos San Miguel LTDA</small></div></div>
    <div class="badge">🔐 Sistema protegido</div>
    <form id="loginForm" novalidate>
      <label for="userRut">RUT / Usuario</label>
      <input id="userRut" type="text" autocomplete="username" value="184467267" placeholder="Ej: 18.446.726-7" required>
      <label for="userPin">Clave</label>
      <input id="userPin" type="password" autocomplete="current-password" placeholder="Ingrese su clave" required>
      <label style="font-weight:500;font-size:13px"><input id="rememberUser" type="checkbox" style="width:auto;margin-right:6px"> Recordar usuario en este equipo</label>
      <div class="loginActions"><button class="primary" type="submit" style="width:100%">Entrar al sistema</button></div>
      <div id="loginError" class="error hidden"></div>
    </form>
    <div class="hint">Clave de esta versión: <b>1234</b></div>
  </section>
</div>
<div id="app" class="hidden">
<div class="shell">
  <aside class="sidebar"><div class="sideBrand"><img src="/logo molino.jpg" alt="Logo"><div><strong>Molino Control</strong><span>Molinos San Miguel LTDA</span></div></div><div class="nav" id="nav"></div><div class="logout"><button id="logoutBtn">🚪 Cerrar sesión</button></div></aside>
  <main class="main"><header class="topbar"><h2 id="pageTitle">Panel Macro</h2><div class="userPill"><strong id="userLabel"></strong><span id="roleLabel" class="role"></span></div></header><div id="content" class="content"></div></main>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(() => {
'use strict';
const ADMIN_RUT='184467267', ACCESS_KEY='1234', DB_NAME='molino-control-db', STORE='workbook';
window.show=()=>{}; const state={user:'',role:'OPERADOR',workbook:null,fileName:'',sheets:[],lastLoaded:null,dbReady:false,currentView:'dashboard'};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s??'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.\-\s]/g,'');
const toNum=v=>{if(v===null||v===undefined||v==='')return 0;if(typeof v==='number')return v;const t=String(v).replace(/\s/g,'').replace(/\./g,'').replace(',', '.').replace(/[^0-9.\-]/g,'');const n=Number(t);return Number.isFinite(n)?n:0};
const money=n=>Number(n||0).toLocaleString('es-CL',{maximumFractionDigits:0});
const dec=n=>Number(n||0).toLocaleString('es-CL',{maximumFractionDigits:2});
const pct=n=>(Number(n||0)*100).toLocaleString('es-CL',{maximumFractionDigits:2})+'%';
function loginError(msg){$('loginError').textContent=msg;$('loginError').classList.remove('hidden')}
function clearLoginError(){$('loginError').classList.add('hidden')}
function hasData(){return !!state.workbook}
function sheetName(part){return (state.sheets||[]).find(n=>norm(n).includes(norm(part)))||null}
function sheetRows(name){if(!name||!state.workbook?.Sheets?.[name])return [];return XLSX.utils.sheet_to_json(state.workbook.Sheets[name],{header:1,defval:null,raw:true});}
function findHeader(rows,terms,limit=80){for(let r=0;r<Math.min(rows.length,limit);r++){const row=(rows[r]||[]).map(x=>norm(x));if(terms.every(t=>row.some(x=>x.includes(norm(t)))))return r;}return -1}
function rowToObjects(rows,headerRow){const hdr=rows[headerRow]||[];return rows.slice(headerRow+1).map(r=>{const o={};hdr.forEach((h,i)=>{const key=String(h??'').trim()||`COL_${i+1}`;o[key]=r?.[i]??null});return o}).filter(o=>Object.values(o).some(v=>v!==null&&v!==''));}
function firstMatchingKey(obj,terms){const keys=Object.keys(obj);return keys.find(k=>terms.some(t=>norm(k).includes(norm(t))))||null}
function totalByKey(arr,key){return arr.reduce((s,r)=>s+toNum(r[key]),0)}

function openDb(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){resolve(null);return;}const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore(STORE);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function saveWorkbook(){if(!state.workbook)return;try{const db=state.dbReady;if(!db)return;await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put({workbook:state.workbook,fileName:state.fileName,lastLoaded:state.lastLoaded},'current');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});}catch(e){console.warn(e)}}
async function loadSavedWorkbook(){try{const db=state.dbReady;if(!db)return;const rec=await new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly');const r=tx.objectStore(STORE).get('current');r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)});if(rec?.workbook){state.workbook=rec.workbook;state.fileName=rec.fileName||'';state.lastLoaded=rec.lastLoaded||null;state.sheets=rec.workbook.SheetNames||[];}}catch(e){console.warn(e)}}

async function login(){clearLoginError();const rut=norm($('userRut').value);const pin=$('userPin').value;if(!rut){loginError('Ingresa un RUT o usuario.');return;}if(pin!==ACCESS_KEY){loginError('Clave incorrecta. Usa 1234.');return;}state.user=rut;state.role=rut===ADMIN_RUT?'ADMIN':'OPERADOR';try{if($('rememberUser').checked)localStorage.setItem('molino_user',$('userRut').value.trim());}catch(e){}$('loginScreen').classList.add('hidden');$('app').classList.remove('hidden');$('userLabel').textContent=rut;$('roleLabel').textContent=state.role;buildNav();show('dashboard');}
function logout(){state.user='';state.role='OPERADOR';$('app').classList.add('hidden');$('loginScreen').classList.remove('hidden');$('userPin').value='';}
function buildNav(){const items=[['dashboard','📊 Panel Macro'],['maestro','📥 Maestro Excel'],['private','📈 Indicadores privados'],['documents','🧾 Documentos'],['clients','👥 Clientes'],['dispatches','🚚 Despachos'],['guides','🧻 Guías'],['ncs','📝 NC / ND'],['iva','💰 IVA'],['admin','⚙️ Administración']];$('nav').innerHTML=items.map(([k,t])=>`<button type="button" data-view="${k}">${t}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.view));}
function show(view){state.currentView=view;$('nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const titles={dashboard:'Panel Macro',maestro:'Maestro Excel',private:'Indicadores privados',documents:'Documentos',clients:'Clientes',dispatches:'Despachos',guides:'Guías',ncs:'NC / ND',iva:'IVA',admin:'Administración'};$('pageTitle').textContent=titles[view]||'Molino Control';const fn={dashboard:renderDashboard,maestro:renderMaestro,private:renderPrivate,documents:renderDocuments,clients:renderClients,dispatches:renderDispatches,guides:renderGuides,ncs:renderNC,iva:renderIVA,admin:renderAdmin}[view]||renderDashboard;fn();}
function empty(title,msg){return `<div class="emptyState"><h3>${esc(title)}</h3><p>${esc(msg)}</p><p>Ve a <b>Maestro Excel</b> y carga el archivo para llenar este módulo.</p></div>`}

function getINE(){const name=sheetName('INE');const rows=sheetRows(name);const out={sheet:name,totalNeto:0,totalKg:0,totalPromedio:0,items:[],mes:'',anio:'',netoHarinas:0,kgHarinas:0,promedioHarinas:0};if(!rows.length)return out;out.mes=rows.flat().find(v=>String(v??'').toLowerCase()==='julio')||'';const h=findHeader(rows,['valor neto','cantidad kg','promedio']);if(h<0)return out;for(let r=h+1;r<rows.length;r++){const label=String(rows[r]?.[0]??'').trim();if(!label)continue;const a=toNum(rows[r]?.[1]),kg=toNum(rows[r]?.[2]),p=toNum(rows[r]?.[3]);if(norm(label).includes('TOTALGENERAL')){out.totalNeto=a;out.totalKg=kg;out.totalPromedio=p;continue;}if(a||kg||p)out.items.push({producto:label,neto:a,kg,promedio:p,vn:toNum(rows[r]?.[4]),kgp:toNum(rows[r]?.[5])});}const har=out.items.filter(x=>norm(x.producto).startsWith('HARINA')&&!norm(x.producto).startsWith('HARINILLA'));out.netoHarinas=har.reduce((s,x)=>s+x.neto,0);out.kgHarinas=har.reduce((s,x)=>s+x.kg,0);out.promedioHarinas=out.kgHarinas?out.netoHarinas/out.kgHarinas:0;return out;}

function getSacos(){let name=sheetName('nestle sacos')||sheetName('Nestle y CPW');const rows=sheetRows(name);const out={sheet:name,ventasSacos:0,kgSacos:0,items:[]};if(!rows.length)return out;const h=findHeader(rows,['CLAVE','CLASIFICACION','VENTAS * SACOS']);if(h>=0){for(let r=h+1;r<rows.length;r++){const clave=String(rows[r]?.[1]??'').trim(),clas=String(rows[r]?.[2]??'').trim(),ventas=toNum(rows[r]?.[3]);if(clave||clas||ventas)out.items.push({clave,clasificacion:clas,ventas});}}const candidates=[];for(let r=0;r<rows.length;r++)for(let c=0;c<rows[r].length;c++){const v=String(rows[r]?.[c]??'').trim();if(/TOTAL.*SACOS/i.test(v))candidates.push(toNum(rows[r]?.[c+1]));}out.ventasSacos=Math.max(...candidates,0);if(!out.ventasSacos&&out.items.length)out.ventasSacos=out.items.reduce((s,x)=>s+x.ventas,0);const kgSheet=sheetName('Nestle y CPW');const krows=sheetRows(kgSheet);for(const row of krows){for(let i=0;i<row.length;i++){if(String(row[i]??'').toUpperCase().includes('TOTAL SACOS KG'))out.kgSacos=toNum(row[i+1])||out.kgSacos;}}if(!out.kgSacos)out.kgSacos=out.items.reduce((s,x)=>{const m=String(x.clasificacion).match(/(\d+)\s*KG/i);return s+(m?x.ventas*Number(m[1]):0)},0);return out;}

function getGranel(){
  const candidates=[];
  for(const name of (state.sheets||[]).filter(n=>/GRANEL/i.test(n)||norm(n)==='NESTLEYCPW')){
    const rows=sheetRows(name); if(!rows.length) continue;
    let year='',month='',total=0;
    for(const row of rows.slice(0,8)){
      for(let c=0;c<row.length;c++){
        const k=norm(row[c]);
        if(k==='ANO' && row[c+1]!=null) year=String(row[c+1]);
        if(k==='MES' && row[c+1]!=null) month=String(row[c+1]);
      }
    }
    for(const row of rows){
      for(let c=0;c<row.length;c++){
        if(/TOTAL\s*GRANEL/i.test(String(row[c]??''))){const x=toNum(row[c+1]);if(x) total=Math.max(total,x);}
      }
    }
    candidates.push({sheet:name,year,month,total});
  }
  // Prefer the current 2026 July-style sheet when present; otherwise use the first sheet with a total.
  const preferred=candidates.find(x=>/2026/.test(x.year)&&/julio/i.test(x.month)&&x.total>0) || candidates.find(x=>x.total>0) || candidates[0] || {sheet:'',year:'',month:'',total:0};
  return {totalGranel:preferred.total||0, groups:candidates};
}

function renderDashboard(){const i=getINE(),s=getSacos(),g=getGranel();$('content').innerHTML=`<div class="hero"><div><small>MOLINO CONTROL</small><h1>Centro de control</h1><p>${hasData()?`Maestro cargado: ${esc(state.fileName)}`:'Sistema listo para recibir el Maestro Excel.'}</p></div><div class="heroIcon">🏭</div></div><div class="grid"><div class="card metric"><small>VENTA NETA INE</small><strong>$ ${money(i.totalNeto)}</strong></div><div class="card metric"><small>KG INE</small><strong>${money(i.totalKg)}</strong></div><div class="card metric"><small>PROMEDIO INE</small><strong>$ ${dec(i.totalPromedio)}/kg</strong></div><div class="card metric"><small>KG HARINAS</small><strong>${money(i.kgHarinas)}</strong></div><div class="card metric"><small>VENTAS * SACOS</small><strong>${money(s.ventasSacos)}</strong></div><div class="card metric"><small>KG SACOS</small><strong>${money(s.kgSacos)}</strong></div><div class="card metric"><small>KG GRANEL</small><strong>${money(g.totalGranel)}</strong></div><div class="card metric"><small>HOJAS LEÍDAS</small><strong>${state.sheets.length}</strong></div></div>${hasData()?`<div class="card"><h3>Maestro Excel activo</h3><p><b>${esc(state.fileName)}</b> · cargado ${state.lastLoaded?new Date(state.lastLoaded).toLocaleString('es-CL'):''}</p><div class="sheetList">${state.sheets.map(n=>`<span class="sheetTag">${esc(n)}</span>`).join('')}</div></div>`:empty('Aún no hay Maestro cargado','Carga tu Excel para que todos los módulos se llenen automáticamente.')}`;}

function renderMaestro(){$('content').innerHTML=`<div class="card"><h3>📥 Maestro Excel</h3><p class="muted">Carga tu Excel completo. Después puedes entrar a cualquier módulo y la información se mostrará desde la hoja correspondiente.</p><div class="drop"><input id="excelFile" type="file" accept=".xlsx,.xls" style="max-width:520px"><p>El archivo se procesa en este navegador y queda guardado localmente en este equipo.</p></div><div id="loadStatus"></div>${hasData()?'<div class="moduleNav" style="margin-top:14px"><button type="button" class="primary" data-jump="dashboard">Ver Panel Macro</button><button type="button" class="secondary" data-jump="private">Ver INE / Sacos / Granel</button><button type="button" class="secondary" data-jump="documents">Ver Documentos</button></div>':''}</div>${hasData()?`<div class="card"><h3>Archivo actual</h3><p><b>${esc(state.fileName)}</b> · ${state.sheets.length} hojas.</p><button type="button" class="secondary" id="clearExcel">Quitar Excel de este equipo</button></div>`:''}`;$('excelFile').onchange=e=>{const f=e.target.files?.[0];if(f)loadExcel(f)};if($('clearExcel'))$('clearExcel').onclick=clearWorkbook;get('content').querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>show(b.dataset.jump));}
window.show=show; async function loadExcel(file){const out=$('loadStatus');out.innerHTML='<div class="status warn">⏳ Leyendo Excel…</div>';try{if(typeof XLSX==='undefined')throw new Error('No se pudo cargar el lector Excel. Recarga la página.');const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array',cellDates:true});if(!wb.SheetNames?.length)throw new Error('El archivo no contiene hojas.');state.workbook=wb;state.sheets=[...wb.SheetNames];state.fileName=file.name;state.lastLoaded=Date.now();await saveWorkbook();out.innerHTML=`<div class="status ok">✅ Excel cargado correctamente. ${wb.SheetNames.length} hojas disponibles.</div>`;setTimeout(()=>show(state.currentView||'dashboard'),250);}catch(err){out.innerHTML=`<div class="status err">❌ ${esc(err.message||err)}</div>`;}}
async function clearWorkbook(){state.workbook=null;state.sheets=[];state.fileName='';state.lastLoaded=null;try{if(state.dbReady){const tx=state.dbReady.transaction(STORE,'readwrite');tx.objectStore(STORE).delete('current');}}catch(e){}show('maestro');}

function renderPrivate(){if(state.role!=='ADMIN'){get('content').innerHTML=empty('Indicadores privados','Este módulo es exclusivo del administrador.');return;}const i=getINE(),s=getSacos(),g=getGranel();$('content').innerHTML=`<div class="card"><h3>📈 Indicadores privados</h3><div class="kpiRow"><div class="kpi">Neto INE<b>$ ${money(i.totalNeto)}</b></div><div class="kpi">Promedio INE<b>$ ${dec(i.totalPromedio)}/kg</b></div><div class="kpi">Promedio harinas<b>$ ${dec(i.promedioHarinas)}/kg</b></div><div class="kpi">KG harinas<b>${money(i.kgHarinas)}</b></div><div class="kpi">Ventas * sacos<b>${money(s.ventasSacos)}</b></div><div class="kpi">KG sacos<b>${money(s.kgSacos)}</b></div><div class="kpi">KG granel<b>${money(g.totalGranel)}</b></div><div class="kpi">Período<b>${esc(i.sheet||'INE')}</b></div></div></div>${i.items.length?`<div class="card"><h3>Detalle INE</h3>${renderSimpleTable(i.items,['producto','neto','kg','promedio','vn','kgp'])}</div>`:empty('Sin detalle INE','El Excel no entregó una tabla INE legible.')}`;}
function renderSimpleTable(rows,cols){return `<div class="tableWrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(formatCell(r[c],c))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function formatCell(v,c){if(c==='neto'||c==='ventas'||c==='total')return '$ '+money(v);if(c==='kg'||c==='kgSacos')return money(v);if(c==='promedio')return '$ '+dec(v);if(c==='vn'||c==='kgp')return pct(v);return v}

function renderSourceModule(title,sourceNames,opts={}){if(!hasData()){get('content').innerHTML=empty(title,'No hay Maestro cargado.');return;}const selected=sourceNames.flatMap(part=>(state.sheets||[]).filter(n=>norm(n).includes(norm(part))));const unique=[...new Set(selected)];if(!unique.length){get('content').innerHTML=empty(title,'No se encontró la hoja fuente correspondiente en el Excel.');return;}const tabs=unique.map((n,i)=>`<button type="button" class="${i===0?'primary':''}" data-sheettab="${esc(n)}">${esc(n)}</button>`).join('');get('content').innerHTML=`<div class="card"><div class="moduleNav">${tabs}</div><div id="moduleTable"></div></div>`;const renderTab=name=>{$('moduleTable').innerHTML=renderSheetTable(name,opts.maxRows||700);};renderTab(unique[0]);get('content').querySelectorAll('[data-sheettab]').forEach(b=>b.onclick=()=>{get('content').querySelectorAll('[data-sheettab]').forEach(x=>x.classList.remove('primary'));b.classList.add('primary');renderTab(b.dataset.sheettab);});}
function renderSheetTable(name,maxRows){const rows=sheetRows(name);if(!rows.length)return empty('Hoja vacía',name);const h=findHeader(rows,['Fecha'],40)>=0?findHeader(rows,['Fecha'],40):0;const hdr=(rows[h]||[]).map((x,i)=>String(x??'').trim()||`COL_${i+1}`);const body=rows.slice(h+1,maxRows+h+1).filter(r=>r.some(v=>v!==null&&v!==''));return `<div class="banner"><b>${esc(name)}</b> · ${body.length.toLocaleString('es-CL')} filas visibles</div><div class="tableWrap"><table class="table"><thead><tr>${hdr.slice(0,24).map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${body.map(r=>`<tr>${hdr.slice(0,24).map((_,i)=>`<td>${esc(formatGeneric(r?.[i]))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function formatGeneric(v){if(v instanceof Date)return v.toLocaleDateString('es-CL');if(typeof v==='number')return v.toLocaleString('es-CL',{maximumFractionDigits:2});return v??''}

function normRut(v){return String(v??'').toUpperCase().replace(/[^0-9K]/g,'');}
function mapRow(headers,row){const o={};headers.forEach((h,i)=>{const key=String(h??'').trim()||`COL_${i+1}`;o[key]=row?.[i]??null});return o;}
function firstHeaderIndex(headers,terms){for(let i=0;i<headers.length;i++){const k=norm(headers[i]);if(terms.some(t=>k.includes(norm(t))))return i;}return -1;}
function detectHeader(rows, preferredTerms=[]){let h=findHeader(rows,preferredTerms,100);if(h>=0)return h;return findHeader(rows,['RUT'],100);}
function sourceObjects(source){const rows=sheetRows(source);if(!rows.length)return [];const h=detectHeader(rows,['RUT']);if(h<0)return [];const headers=rows[h]||[];return rows.slice(h+1).filter(r=>r?.some(v=>v!==null&&v!=='' )).map(r=>mapRow(headers,r));}
function recordFromDoc(source,obj){const keys=Object.keys(obj);const pick=(terms)=>{const k=firstMatchingKey(obj,terms);return k?obj[k]:''};const rut=normRut(pick(['RUT','RUTRECEPTOR','RUTCLIENTE']));const cliente=String(pick(['CLIENTE','NOMBRERECEPTOR','RAZONSOCIAL','NOMBRE'] )??'').trim();const folio=pick(['FOLIO','N° FOLIO','NUMERO DOCUMENTO']);const fecha=pick(['FECHA']);const tipo=pick(['TIPO DOCUMENTO','TIPO','DOCUMENTO','COD SII']);const neto=pick(['NETO']);const iva=pick(['IVA']);const total=pick(['TOTAL','BRUTO']);return {source,rut,cliente,folio,fecha,tipo,neto:toNum(neto),iva:toNum(iva),total:toNum(total)};}
function getDocumentIndex(){const sources=[...new Set((state.sheets||[]).filter(n=>/LIBRO|GUIAS|BOLETAS|CUADRE FIN DE MES|BASE DE DATOS/i.test(n)))];const docs=[];for(const source of sources){for(const obj of sourceObjects(source)){const d=recordFromDoc(source,obj);if(d.rut)docs.push(d);}}return docs;}
function getClientIndex(){const docs=getDocumentIndex();const map=new Map();for(const d of docs){const key=d.rut;if(!map.has(key))map.set(key,{rut:d.rut,cliente:d.cliente||'Sin nombre',documentos:0,neto:0,iva:0,total:0,sources:new Set(),docs:[]});const c=map.get(key);if((c.cliente==='Sin nombre'||!c.cliente)&&d.cliente)c.cliente=d.cliente;c.documentos++;c.neto+=d.neto;c.iva+=d.iva;c.total+=d.total;c.sources.add(d.source);c.docs.push(d);}return [...map.values()].map(c=>({...c,sources:[...c.sources]})).sort((a,b)=>a.cliente.localeCompare(b.cliente,'es'));}
function showClientFicha(rut){const c=getClientIndex().find(x=>x.rut===normRut(rut));if(!c){$('clientFicha').innerHTML=empty('Cliente no encontrado','No se pudo localizar el RUT en las hojas vinculadas.');return;}const docs=c.docs.slice().sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));$('clientFicha').innerHTML=`<div class="clientFicha"><div class="clientFichaHead"><div><h4>Ficha de cliente</h4><div class="clientMeta"><b>${esc(c.cliente)}</b> · RUT ${esc(c.rut)}</div><div class="clientMeta">Fuentes: ${esc(c.sources.join(', '))}</div></div><div class="clientActions"><button type="button" id="closeFicha">Cerrar ficha</button></div></div><div class="clientKpis"><div class="clientKpi"><small>Documentos</small><strong>${money(c.documentos)}</strong></div><div class="clientKpi"><small>Neto</small><strong>$ ${money(c.neto)}</strong></div><div class="clientKpi"><small>IVA</small><strong>$ ${money(c.iva)}</strong></div><div class="clientKpi"><small>Total</small><strong>$ ${money(c.total)}</strong></div></div><h4 style="font-size:16px;margin:8px 0 10px">Documentos asociados al RUT</h4>${docs.length?renderClientDocsTable(docs):'<div class="emptyState">No hay documentos vinculados a este RUT.</div>'}</div>`;$('closeFicha').onclick=()=>{$('clientFicha').innerHTML='';};}
function renderClientDocsTable(docs){return `<div class="tableWrap"><table class="table"><thead><tr><th>Fuente</th><th>Tipo</th><th>Folio</th><th>Fecha</th><th>Neto</th><th>IVA</th><th>Total</th></tr></thead><tbody>${docs.slice(0,1500).map(d=>`<tr><td>${esc(d.source)}</td><td>${esc(d.tipo)}</td><td>${esc(d.folio)}</td><td>${esc(formatGeneric(d.fecha))}</td><td>$ ${money(d.neto)}</td><td>$ ${money(d.iva)}</td><td>$ ${money(d.total)}</td></tr>`).join('')}</tbody></table></div>`;}

function renderDocuments(){
  if(!hasData()){get('content').innerHTML=empty('Documentos','El módulo está habilitado. Carga el Maestro Excel para ver LIBRO y BOLETAS.');return;}
  renderSourceModule('Documentos',['LIBRO','BOLETAS'],{maxRows:1200});
}
function renderClients(){
  if(!hasData()){get('content').innerHTML=empty('Clientes','El módulo está habilitado. Carga el Maestro Excel para ver clientes y fichas.');return;}
  const items=getClientIndex();
  get('content').innerHTML=`<div class="card"><h3>👥 Clientes y fichas</h3><p class="muted">Cada cliente queda identificado por su RUT. Al abrir la ficha se muestran sus documentos asociados y sus totales.</p><div class="clientSearch"><input id="clientQuery" placeholder="Buscar por nombre o RUT..."><button type="button" id="clearClientSearch">Limpiar</button></div><div id="clientFicha"></div><div id="clientList"></div></div>`;
  const draw=(q='')=>{const qq=norm(String(q));const filtered=items.filter(c=>!qq||norm(c.cliente).includes(qq)||normRut(c.rut).includes(qq));$('clientList').innerHTML=filtered.length?`<div class="tableWrap"><table class="table"><thead><tr><th>Cliente</th><th>RUT</th><th>Documentos</th><th>Neto</th><th>IVA</th><th>Total</th><th>Ficha</th></tr></thead><tbody>${filtered.slice(0,2000).map(c=>`<tr><td><b>${esc(c.cliente)}</b></td><td>${esc(c.rut)}</td><td>${money(c.documentos)}</td><td>$ ${money(c.neto)}</td><td>$ ${money(c.iva)}</td><td>$ ${money(c.total)}</td><td><button type="button" class="clientRowBtn" data-client-rut="${esc(c.rut)}">Ver ficha</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="emptyState">No se encontraron clientes con ese criterio.</div>';$('clientList').querySelectorAll('[data-client-rut]').forEach(b=>b.onclick=()=>showClientFicha(b.dataset.clientRut));};
  $('clientQuery').oninput=e=>draw(e.target.value);$('clearClientSearch').onclick=()=>{$('clientQuery').value='';draw('');};draw();
}

function renderDispatches(){
  if(!hasData()){get('content').innerHTML=empty('Despachos','El módulo está habilitado. Carga el Maestro Excel para ver despachos.');return;}
  const s=getGranel();
  const sac=getSacos();
  get('content').innerHTML=`<div class="grid"><div class="card metric"><small>GRANEL DEL PERÍODO</small><strong>${money(s.totalGranel)} kg</strong></div><div class="card metric"><small>VENTAS * SACOS</small><strong>${money(sac.ventasSacos)}</strong></div><div class="card metric"><small>KG SACOS</small><strong>${money(sac.kgSacos)} kg</strong></div><div class="card metric"><small>FUENTE GRANEL</small><strong style="font-size:16px">${esc(s.groups.find(x=>x.total===s.totalGranel)?.sheet||'')}</strong></div></div><div class="card"><h3>Fuentes de despacho detectadas</h3>${renderSimpleTable(s.groups,['sheet','year','month','total'])}</div>`;
}
function renderGuides(){renderSourceModule('Guías',['GUIAS'],{maxRows:1500});}
function renderNC(){
  if(!hasData()){get('content').innerHTML=empty('NC / ND','El módulo está habilitado. Carga el Maestro Excel para ver notas de crédito y débito.');return;}
  const names=['CUADRE FIN DE MES','LIBRO'],avail=[...new Set(names.flatMap(p=>(state.sheets||[]).filter(n=>norm(n).includes(norm(p)))))],rows=[];
  for(const n of avail){for(const r of sheetRows(n)){const txt=r.map(v=>String(v??'')).join(' | ');if(/NOTA DE CREDITO|NOTA DE DEBITO|CREDITO|DEBITO/i.test(txt))rows.push({hoja:n,detalle:txt});}}
  get('content').innerHTML=`<div class="card"><h3>📝 NC / ND</h3><p class="muted">Registros encontrados: ${rows.length.toLocaleString('es-CL')}</p>${rows.length?renderSimpleTable(rows,['hoja','detalle']):'<div class="emptyState">No se encontraron registros con texto de crédito/débito en las hojas fuente.</div>'}</div>`;
}
function renderIVA(){
  if(!hasData()){get('content').innerHTML=empty('IVA','El módulo está habilitado. Carga el Maestro Excel para ver los valores.');return;}
  const name=sheetName('LIBRO')||sheetName('CUADRE FIN DE MES');if(!name){get('content').innerHTML=empty('IVA','No se encontró LIBRO ni CUADRE FIN DE MES.');return;}
  const rows=sheetRows(name),h=findHeader(rows,['NETO'],100);if(h<0){get('content').innerHTML=renderSheetTable(name,800);return;}
  const hdr=rows[h]||[], idxN=hdr.findIndex(x=>norm(x).includes('NETO')),idxI=hdr.findIndex(x=>norm(x)==='IVA'),idxIH=hdr.findIndex(x=>norm(x).includes('IVAHARINA')),idxB=hdr.findIndex(x=>norm(x).includes('BRUTO'));let neto=0,iva=0,ivah=0,bruto=0;
  for(const r of rows.slice(h+1)){neto+=idxN>=0?toNum(r?.[idxN]):0;iva+=idxI>=0?toNum(r?.[idxI]):0;ivah+=idxIH>=0?toNum(r?.[idxIH]):0;bruto+=idxB>=0?toNum(r?.[idxB]):0;}
  get('content').innerHTML=`<div class="grid"><div class="card metric"><small>NETO</small><strong>$ ${money(neto)}</strong></div><div class="card metric"><small>IVA</small><strong>$ ${money(iva)}</strong></div><div class="card metric"><small>IVA HARINAS</small><strong>$ ${money(ivah)}</strong></div><div class="card metric"><small>BRUTO</small><strong>$ ${money(bruto)}</strong></div></div><div class="card"><h3>Fuente: ${esc(name)}</h3>${renderSheetTable(name,800)}</div>`;
}
function renderAdmin(){if(state.role!=='ADMIN'){get('content').innerHTML=empty('Administración','Este módulo es exclusivo del administrador.');return;}$('content').innerHTML=`<div class="card"><h3>⚙️ Administración</h3><p><b>Usuario:</b> ${esc(state.user)}</p><p><b>Rol:</b> ADMIN</p><p><b>Maestro cargado:</b> ${hasData()?'Sí':'No'}</p><p><b>Archivo:</b> ${esc(state.fileName||'—')}</p><p><b>Hojas:</b> ${state.sheets.length}</p><button type="button" class="secondary" onclick="show('maestro')">📥 Gestionar Maestro Excel</button></div>`;}

$('loginForm').addEventListener('submit',e=>{e.preventDefault();login();});$('logoutBtn').addEventListener('click',logout);
(async()=>{try{$('userRut').value=localStorage.getItem('molino_user')||'184467267';}catch(e){}try{state.dbReady=await openDb();await loadSavedWorkbook();}catch(e){console.warn(e)}buildNav();show('dashboard');})();
})();
