/* V30 · Reestructura visual profesional: menos apariencia de libro contable, más centro de control */
:root{--navy:#0f356d;--navy2:#174b91;--soft:#f5f8fc;--soft2:#eef4fb;--shadow:0 10px 30px rgba(15,53,109,.07);--shadow2:0 16px 42px rgba(15,53,109,.10)}
