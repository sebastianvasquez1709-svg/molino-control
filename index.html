<style>
:root{--blue:#123a78;--blue2:#1e56a0;--bg:#f4f7fb;--card:#fff;--text:#1d2939;--muted:#667085;--line:#d9e2ef;--green:#0e9f6e;--red:#c93b3b;--amber:#b7791f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}body{overflow-x:hidden}.hidden{display:none!important}button,input,select{font:inherit}button{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:var(--blue);color:#fff}.secondary{background:#e9f0fa;color:var(--blue)}.danger{background:#fff1f1;color:#b42318}.ghost{background:transparent;color:var(--blue2);border:1px solid #c7d4e6}
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#eef4ff,#f8fbff)}.loginCard{width:min(560px,96vw);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(18,58,120,.12);padding:34px}.brand{display:flex;align-items:center;gap:14px;margin-bottom:18px}.brand img{width:68px;height:68px;object-fit:contain;border-radius:10px}.brand h1{margin:0;color:var(--blue);font-size:28px}.brand small{color:var(--muted)}.badge{padding:10px 14px;border-radius:10px;background:#fff3f1;color:#b42318;font-weight:700;text-align:center;margin:14px 0 20px}label{display:block;font-weight:700;margin:14px 0 7px}input,select{width:100%;padding:11px 13px;border:1px solid #c9d6e6;border-radius:10px;background:#fff}input:focus,select:focus{outline:3px solid rgba(30,86,160,.14);border-color:var(--blue2)}.error{color:#b42318;background:#fff1f1;border:1px solid #f3c5c5;border-radius:10px;padding:10px;margin-top:12px}.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:12px}
#app{min-height:100vh}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--blue);color:#fff;padding:15px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.sideBrand{display:flex;gap:10px;align-items:center;padding:8px 7px 18px}.sideBrand img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:8px}.sideBrand strong{display:block;font-size:18px}.sideBrand span{display:block;font-size:11px;opacity:.78}.nav{display:grid;gap:4px}.nav button{background:transparent;color:#fff;text-align:left;padding:11px 12px;border-radius:9px}.nav button:hover,.nav button.active{background:rgba(255,255,255,.14)}.logout{margin-top:auto;padding-top:14px}.logout button{width:100%;background:#fff;color:var(--blue)}
.main{min-width:0}.topbar{background:#fff;border-bottom:1px solid var(--line);padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;position:sticky;top:0;z-index:5}.topbar h2{margin:0;color:var(--blue);font-size:21px}.userPill{font-size:12px;text-align:right}.userPill strong{display:block}.role{display:inline-block;margin-top:4px;padding:4px 8px;background:#edf5ff;color:var(--blue2);border-radius:999px;font-weight:800}.content{padding:20px;max-width:1500px;margin:0 auto}
.hero{background:linear-gradient(135deg,#123a78,#1e56a0);color:#fff;border-radius:18px;padding:22px;display:flex;justify-content:space-between;gap:20px;align-items:center}.hero h1{margin:7px 0;font-size:28px}.hero p{margin:0;opacity:.92}.heroIcon{font-size:52px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin:16px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px}.metric small{display:block;color:var(--muted)}.metric strong{display:block;font-size:26px;color:var(--blue);margin-top:4px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0 11px}.sectionTitle h3,.card h3{margin:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar>*{width:auto}.toolbar .grow{flex:1;min-width:220px}.drop{border:2px dashed #b9c9dd;border-radius:14px;padding:26px;text-align:center;background:#f9fbff}.drop p{color:var(--muted)}.status{padding:10px 12px;border-radius:10px;margin-top:12px}.status.ok{background:#ecfdf3;color:#067647}.status.warn{background:#fff8eb;color:#9a6700}.status.err{background:#fff1f1;color:#b42318}.status.info{background:#eef4ff;color:#174ea6}.progress{height:10px;background:#e7eef7;border-radius:999px;overflow:hidden;margin-top:10px}.progress>div{height:100%;width:0;background:var(--blue2);transition:width .15s ease}
.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:560px}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:8px 9px;border-bottom:1px solid #edf1f6;white-space:nowrap;text-align:left;font-size:12px}.table th{background:#f7f9fc;color:#475467;position:sticky;top:0;z-index:1}.muted{color:var(--muted)}.note{font-size:12px;color:var(--muted)}.kpiRow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.kpi small{display:block;color:var(--muted)}.kpi b{display:block;font-size:22px;color:var(--blue);margin-top:4px}.sheetList{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.sheetTag{padding:6px 9px;border-radius:999px;background:#eef4fb;color:var(--blue);font-size:12px;font-weight:700}.infoGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.info{padding:12px;background:#f8fafc;border:1px solid var(--line);border-radius:10px}.clientCard{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}.clientHead{display:flex;justify-content:space-between;gap:10px;align-items:start}.clientHead h4{margin:0;color:var(--blue)}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;background:#fbfcfe}.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}.pager .pages{color:var(--muted);font-size:12px}.loadingOverlay{position:fixed;inset:0;background:rgba(255,255,255,.82);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100}.loadingOverlay.show{display:flex}.loadingBox{width:min(560px,92vw);background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 16px 40px rgba(18,58,120,.18)}.loadingTitle{font-weight:800;color:var(--blue);font-size:18px}.testReport{font-family:ui-monospace,monospace;padding:20px;white-space:pre-wrap}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.kpiRow{grid-template-columns:repeat(2,minmax(0,1fr))}.infoGrid{grid-template-columns:1fr 1fr}}@media(max-width:820px){.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto}.content{padding:14px}.topbar{position:static}}@media(max-width:560px){.grid,.kpiRow,.infoGrid{grid-template-columns:1fr}.loginCard{padding:22px}}
</style>

<div id="loginScreen"><section class="loginCard"><div class="brand"><img src="/logo molino.jpg" alt="Molinos San Miguel"><div><h1>Molino Control</h1><small>Molinos San Miguel LTDA</small></div></div><div class="badge">🔐 Sistema protegido</div><form id="loginForm" novalidate><label for="userRut">RUT / Usuario</label><input id="userRut" type="text" autocomplete="username" value="184467267" placeholder="Ej: 18.446.726-7" required><label for="userPin">Clave</label><input id="userPin" type="password" autocomplete="current-password" placeholder="Ingrese su clave" required><label style="font-weight:500;font-size:13px"><input id="rememberUser" type="checkbox" style="width:auto;margin-right:6px"> Recordar usuario en este equipo</label><button class="primary" type="submit" style="width:100%;margin-top:14px">Entrar al sistema</button><div id="loginError" class="error hidden"></div></form><div class="hint">Clave de prototipo actual: <b>1234</b>.</div></section></div>
<div id="app" class="hidden"><div class="shell"><aside class="sidebar"><div class="sideBrand"><img src="/logo molino.jpg" alt="Logo"><div><strong>Molino Control</strong><span>Molinos San Miguel LTDA</span></div></div><div class="nav" id="nav"></div><div class="logout"><button id="logoutBtn" type="button">🚪 Cerrar sesión</button></div></aside><main class="main"><header class="topbar"><h2 id="pageTitle">Panel Macro</h2><div class="userPill"><strong id="userLabel"></strong><span id="roleLabel" class="role"></span></div></header><div id="content" class="content"></div></main></div></div>
<div id="loadingOverlay" class="loadingOverlay" aria-live="polite"><div class="loadingBox"><div class="loadingTitle" id="loadingTitle">Procesando Excel…</div><div class="note" id="loadingDetail">Preparando archivo</div><div class="progress"><div id="loadingBar"></div></div><div class="note" id="loadingPercent" style="margin-top:8px">0%</div></div></div>

 const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.id='xlsxLib';document.head.appendChild(s);

<script>
(()=>{
'use strict';
const ADMIN_RUT='184467267',ACCESS_KEY='1234',DB='molino-control-v8',STORE='snapshot-v1';
const state={user:'',role:'OPERADOR',snapshot:null,page:1,search:{}};
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const normalize=v=>String(v??'').toUpperCase().replace(/[.\-\s]/g,'');
const n=v=>{if(typeof v==='number')return Number.isFinite(v)?v:0;const x=String(v??'').replace(/\$/g,'').replace(/\s/g,'').replace(/\.(?=\d{3}(?:\D|$))/g,'').replace(',','.');const z=parseFloat(x);return Number.isFinite(z)?z:0};
const money=v=>n(v).toLocaleString('es-CL',{maximumFractionDigits:0}),dec=v=>n(v).toLocaleString('es-CL',{maximumFractionDigits:2});
const safeDate=v=>{if(v instanceof Date)return v.toLocaleDateString('es-CL');if(typeof v==='number'&&v>20000&&v<60000)return new Date(Math.round((v-25569)*86400000)).toLocaleDateString('es-CL');return String(v??'')};
const emptySnap=()=>({fileName:'',lastLoaded:0,sheets:[],metrics:{ine:{totalNeto:0,totalKg:0,totalPromedio:0,netoHarinas:0,kgHarinas:0,promedioHarinas:0,periodo:'',items:[]},sacos:{ventasSacos:0,kgSacos:0,items:[]},granel:{totalGranel:0,items:[]}},documents:[],clients:[],guides:[],nc:[],iva:{neto:0,iva:0,total:0,docs:0}});
const hasData=()=>!!state.snapshot;
function setLoading(on,title='Procesando Excel…',detail='Preparando archivo',pct=0){$('loadingOverlay').classList.toggle('show',on);$('loadingTitle').textContent=title;$('loadingDetail').textContent=detail;$('loadingBar').style.width=pct+'%';$('loadingPercent').textContent=Math.round(pct)+'%'}
function status(text,kind='info'){return `<div class="status ${kind}">${text}</div>`}
function pageSize(){return 50}
function paginate(rows,key){const q=(state.search[key]||'').toLowerCase();const filtered=!q?rows:rows.filter(x=>Object.values(x).join(' ').toLowerCase().includes(q));const total=Math.max(1,Math.ceil(filtered.length/pageSize()));state.page=Math.min(state.page,total);const page=state.page;return {filtered,total,page,items:filtered.slice((page-1)*pageSize(),page*pageSize())}}
function pager(total,page,change){if(total<=1)return '';return `<div class="pager"><button class="secondary" type="button" ${page<=1?'disabled':''} data-pager="prev">← Anterior</button><span class="pages">Página ${page} de ${total}</span><button class="secondary" type="button" ${page>=total?'disabled':''} data-pager="next">Siguiente →</button></div>`}
function bindPager(container,key,total){container.querySelector('[data-pager="prev"]')?.addEventListener('click',()=>{state.page=Math.max(1,state.page-1);renderCurrent(key)});container.querySelector('[data-pager="next"]')?.addEventListener('click',()=>{state.page=Math.min(total,state.page+1);renderCurrent(key)});}
let currentView='dashboard';
function buildNav(){const items=[['dashboard','📊 Panel Macro'],['maestro','📥 Maestro Excel'],['private','📈 Indicadores privados'],['documents','🧾 Documentos'],['clients','👥 Clientes'],['dispatches','🚚 Despachos'],['guides','🧻 Guías'],['ncs','📝 NC / ND'],['iva','💰 IVA'],['admin','⚙️ Administración']];$('nav').innerHTML=items.map(([k,t])=>`<button type="button" data-view="${k}">${t}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));}
function renderDenied(){ $('content').innerHTML='<div class="card"><h3>Acceso restringido</h3><p class="muted">Este módulo está disponible solo para ADMIN.</p></div>'; }
function show(view){currentView=view;state.page=1;$('nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const titles={dashboard:'Panel Macro',maestro:'Maestro Excel',private:'Indicadores privados',documents:'Documentos',clients:'Clientes',dispatches:'Despachos',guides:'Guías',ncs:'NC / ND',iva:'IVA',admin:'Administración'};$('pageTitle').textContent=titles[view]||'Molino Control';try{if(view==='admin'||view==='private'){if(state.role!=='ADMIN')return renderDenied()}({dashboard:renderDashboard,maestro:renderMaestro,private:renderPrivate,documents:renderDocuments,clients:renderClients,dispatches:renderDispatches,guides:renderGuides,ncs:renderNC,iva:renderIva,admin:renderAdmin}[view]||renderDashboard)();}catch(e){$('content').innerHTML=`<div class="card"><h3>⚠️ Error en ${esc(titles[view]||'Módulo')}</h3>${status(esc(e?.message||String(e)),'err')}<div class="toolbar" style="margin-top:12px"><button class="secondary" type="button" onclick="show('${view}')">Reintentar</button></div></div>`}}
function table(headers,rows){const body=rows.map(r=>`<tr>${headers.map(h=>`<td>${esc(r[h])}</td>`).join('')}</tr>`).join('');return `<div class="tableWrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${body||`<tr><td colspan="${headers.length}">Sin registros</td></tr>`}</tbody></table></div>`}
function downloadCsv(filename,rows){if(!rows.length){alert('No hay datos para exportar.');return}const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];const csv=[keys.join(';'),...rows.map(r=>keys.map(k=>`"${String(r[k]??'').replace(/"/g,'""')}"`).join(';'))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
window.openClient=key=>{const c=(state.snapshot?.clients||[]).find(x=>x.key===key);if(!c)return;$('pageTitle').textContent='Ficha de cliente';$('nav').querySelectorAll('button').forEach(b=>b.classList.remove('active'));$('content').innerHTML=`<div class="card"><div class="sectionTitle"><h3>👤 ${esc(c.nombre)}</h3><button class="secondary" type="button" onclick="show('clients')">← Volver</button></div><div class="infoGrid"><div class="info"><small>RUT</small><b>${esc(c.rut||'No informado')}</b></div><div class="info"><small>Documentos</small><b>${c.documentos.length.toLocaleString('es-CL')}</b></div><div class="info"><small>Neto acumulado</small><b>$ ${money(c.neto)}</b></div><div class="info"><small>IVA acumulado</small><b>$ ${money(c.iva)}</b></div><div class="info"><small>Total acumulado</small><b>$ ${money(c.total)}</b></div><div class="info"><small>Fuentes</small><b>${esc([...new Set(c.documentos.map(d=>d.fuente))].join(', ')||'—')}</b></div></div></div><div class="card" style="margin-top:14px"><h3>Documentos asociados</h3>${table(['fuente','fecha','folio','tipo','neto','iva','total'],c.documentos.slice(0,500).map(d=>({fuente:d.fuente,fecha:safeDate(d.fecha),folio:d.folio,tipo:d.tipo,neto:'$ '+money(d.neto),iva:'$ '+money(d.iva),total:'$ '+money(d.total)})))}<p class="note">Mostrando hasta 500 documentos asociados.</p></div>`}
window.exportDocuments=()=>downloadCsv('documentos_molino_control.csv',state.snapshot?.documents||[]);window.exportClients=()=>downloadCsv('clientes_molino_control.csv',(state.snapshot?.clients||[]).map(c=>({nombre:c.nombre,rut:c.rut,documentos:c.documentos.length,neto:c.neto,iva:c.iva,total:c.total})));window.exportGuides=()=>downloadCsv('guias_molino_control.csv',state.snapshot?.guides||[]);
function renderDashboard(){const m=state.snapshot?.metrics||emptySnap().metrics;const ine=m.ine,s=m.sacos,g=m.granel;$('content').innerHTML=`<div class="hero"><div><small>MOLINO CONTROL</small><h1>Centro de control</h1><p>${hasData()?`Maestro cargado: ${esc(state.snapshot.fileName)}`:'Carga el Excel Maestro para comenzar.'}</p></div><div class="heroIcon">🏭</div></div><div class="grid"><div class="card metric"><small>VENTA NETA INE</small><strong>$ ${money(ine.totalNeto)}</strong></div><div class="card metric"><small>KG INE</small><strong>${money(ine.totalKg)}</strong></div><div class="card metric"><small>PROMEDIO INE</small><strong>$ ${dec(ine.totalPromedio)}/kg</strong></div><div class="card metric"><small>KG HARINAS</small><strong>${money(ine.kgHarinas)}</strong></div><div class="card metric"><small>VENTAS * SACOS</small><strong>${money(s.ventasSacos)}</strong></div><div class="card metric"><small>KG SACOS</small><strong>${money(s.kgSacos)}</strong></div><div class="card metric"><small>KG GRANEL</small><strong>${money(g.totalGranel)}</strong></div><div class="card metric"><small>CLIENTES</small><strong>${(state.snapshot?.clients||[]).length.toLocaleString('es-CL')}</strong></div></div><div class="card"><div class="sectionTitle"><h3>Estado del Maestro</h3><span class="note">${hasData()?`Cargado ${esc(new Date(state.snapshot.lastLoaded).toLocaleString('es-CL'))}`:'Sin archivo'}</span></div>${hasData()?`<div class="sheetList">${state.snapshot.sheets.map(x=>`<span class="sheetTag">${esc(x)}</span>`).join('')}</div>`:'<div class="empty">Ve a <b>Maestro Excel</b> y carga el archivo.</div>'}</div>`}
function renderMaestro(){$('content').innerHTML=`<div class="card"><div class="sectionTitle"><h3>📥 Maestro Excel</h3><div class="toolbar"><button class="secondary" type="button" id="clearBtn">Limpiar carga</button></div></div><div class="drop"><input id="excelFile" type="file" accept=".xlsx,.xls"><p>Se procesa en segundo plano para evitar que la aplicación quede pegada.</p><div id="loadStatus">${hasData()?status(`✅ Archivo activo: <b>${esc(state.snapshot.fileName)}</b> · ${state.snapshot.sheets.length} hojas`,'ok'):status('Selecciona el Excel Maestro.','info')}</div></div></div><div class="card" style="margin-top:14px"><h3>Hojas detectadas</h3><div class="sheetList">${hasData()?state.snapshot.sheets.map(x=>`<span class="sheetTag">${esc(x)}</span>`).join(''):'<span class="muted">Sin archivo cargado</span>'}</div></div>`;$('clearBtn').onclick=()=>{state.snapshot=null;deleteSnapshot();renderMaestro()};$('excelFile').addEventListener('change',e=>{const f=e.target.files?.[0];if(f)loadExcel(f)})}
function renderPrivate(){const m=state.snapshot?.metrics||emptySnap().metrics,ine=m.ine,s=m.sacos,g=m.granel;$('content').innerHTML=`<div class="card"><h3>📈 Indicadores privados</h3><p class="muted">Visible para ADMIN.</p><div class="kpiRow"><div class="kpi"><small>INE NETO</small><b>$ ${money(ine.totalNeto)}</b></div><div class="kpi"><small>INE PROMEDIO</small><b>$ ${dec(ine.totalPromedio)}/kg</b></div><div class="kpi"><small>PROMEDIO HARINAS</small><b>$ ${dec(ine.promedioHarinas)}/kg</b></div><div class="kpi"><small>KG HARINAS</small><b>${money(ine.kgHarinas)}</b></div><div class="kpi"><small>VENTAS * SACOS</small><b>${money(s.ventasSacos)}</b></div><div class="kpi"><small>KG SACOS</small><b>${money(s.kgSacos)}</b></div><div class="kpi"><small>KG GRANEL</small><b>${money(g.totalGranel)}</b></div><div class="kpi"><small>PERÍODO</small><b>${esc(ine.periodo||'—')}</b></div></div></div><div class="card" style="margin-top:14px"><h3>Detalle INE</h3>${table(['name','neto','kg','promedio','vn','kgp'],ine.items.map(x=>({name:x.name,neto:'$ '+money(x.neto),kg:money(x.kg),promedio:'$ '+dec(x.promedio),vn:(n(x.vn)*100).toFixed(2)+'%',kgp:(n(x.kgp)*100).toFixed(2)+'%'})))}</div>`}
function renderDocuments(){const rows=state.snapshot?.documents||[];const p=paginate(rows,'documents');$('content').innerHTML=`<div class="card"><div class="sectionTitle"><h3>🧾 Documentos</h3><div class="toolbar"><input id="docQ" class="grow" placeholder="Buscar folio, cliente, RUT o tipo" value="${esc(state.search.documents||'')}"><button class="secondary" type="button" id="docCsv">⬇️ Exportar CSV</button></div></div><p class="note">${p.filtered.length.toLocaleString('es-CL')} documentos encontrados · mostrando ${p.items.length}.</p><div id="docTable">${table(['fuente','fecha','folio','tipo','cliente','rut','neto','iva','total'],p.items.map(x=>({...x,fecha:safeDate(x.fecha),neto:'$ '+money(x.neto),iva:'$ '+money(x.iva),total:'$ '+money(x.total)})))}</div>${pager(p.total,p.page,'documents')}</div>`;$('docQ').oninput=e=>{state.search.documents=e.target.value;state.page=1;renderDocuments()};$('docCsv').onclick=()=>downloadCsv('documentos_molino_control.csv',rows);bindPager($('content'),'documents',p.total)}
function renderClients(){const rows=state.snapshot?.clients||[];const p=paginate(rows,'clients');$('content').innerHTML=`<div class="card"><div class="sectionTitle"><h3>👥 Clientes</h3><div class="toolbar"><input id="clientQ" class="grow" placeholder="Buscar por nombre o RUT" value="${esc(state.search.clients||'')}"><button class="secondary" type="button" id="clientCsv">⬇️ Exportar CSV</button></div></div><p class="note">${p.filtered.length.toLocaleString('es-CL')} clientes/identificadores.</p><div id="clientList" class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${p.items.map(c=>`<div class="clientCard"><div class="clientHead"><div><h4>${esc(c.nombre)}</h4><div class="note">${esc(c.rut||'RUT no informado')}</div></div><button class="primary" type="button" onclick="openClient('${esc(c.key)}')">Ver ficha</button></div><div class="infoGrid" style="margin-top:10px"><div class="info"><small>Documentos</small><b>${c.documentos.length}</b></div><div class="info"><small>Neto</small><b>$ ${money(c.neto)}</b></div><div class="info"><small>Total</small><b>$ ${money(c.total)}</b></div></div></div>`).join('')||'<div class="empty">No hay coincidencias.</div>'}</div>${pager(p.total,p.page,'clients')}</div>`;$('clientQ').oninput=e=>{state.search.clients=e.target.value;state.page=1;renderClients()};$('clientCsv').onclick=()=>downloadCsv('clientes_molino_control.csv',rows.map(c=>({nombre:c.nombre,rut:c.rut,documentos:c.documentos.length,neto:c.neto,iva:c.iva,total:c.total})));bindPager($('content'),'clients',p.total)}
function renderDispatches(){const m=state.snapshot?.metrics||emptySnap().metrics;const g=m.granel,s=m.sacos;$('content').innerHTML=`<div class="card"><h3>🚚 Despachos</h3><div class="kpiRow"><div class="kpi"><small>VENTAS * SACOS</small><b>${money(s.ventasSacos)}</b></div><div class="kpi"><small>KG SACOS</small><b>${money(s.kgSacos)}</b></div><div class="kpi"><small>KG GRANEL</small><b>${money(g.totalGranel)}</b></div><div class="kpi"><small>DETALLE GRANEL</small><b>${g.items.length}</b></div></div></div><div class="card" style="margin-top:14px"><h3>Detalle Granel</h3>${table(['fuente','producto','kg'],g.items.map(x=>({...x,kg:money(x.kg)})))}</div><div class="card" style="margin-top:14px"><h3>Clasificación de Sacos</h3>${table(['clave','clasificacion','ventas'],s.items.map(x=>({...x,ventas:money(x.ventas)})))}</div>`}
function renderGuides(){const rows=state.snapshot?.guides||[];const p=paginate(rows,'guides');$('content').innerHTML=`<div class="card"><div class="sectionTitle"><h3>🧻 Guías</h3><div class="toolbar"><input id="guideQ" class="grow" placeholder="Buscar folio, RUT o receptor" value="${esc(state.search.guides||'')}"><button class="secondary" type="button" id="guideCsv">⬇️ Exportar CSV</button></div></div><p class="note">${p.filtered.length.toLocaleString('es-CL')} guías.</p><div id="guideTable">${table(['folio','fecha','estado','operacion','rut','receptor','neto','iva','total','ref'],p.items.map(x=>({...x,fecha:safeDate(x.fecha),neto:'$ '+money(x.neto),iva:'$ '+money(x.iva),total:'$ '+money(x.total)})))}</div>${pager(p.total,p.page,'guides')}</div>`;$('guideQ').oninput=e=>{state.search.guides=e.target.value;state.page=1;renderGuides()};$('guideCsv').onclick=()=>downloadCsv('guias_molino_control.csv',rows.map(x=>({...x,fecha:safeDate(x.fecha)})));bindPager($('content'),'guides',p.total)}
function renderNC(){const rows=state.snapshot?.nc||[];$('content').innerHTML=`<div class="card"><h3>📝 NC / ND</h3><p class="muted">Notas de crédito/débito detectadas desde LIBRO y CUADRE FIN DE MES.</p>${table(['fuente','folio','fecha','tipo','neto','iva','total'],rows.map(x=>({...x,fecha:safeDate(x.fecha),neto:'$ '+money(x.neto),iva:'$ '+money(x.iva),total:'$ '+money(x.total)})))}</div>`}
function renderIva(){const i=state.snapshot?.metrics?.iva||emptySnap().metrics.iva;$('content').innerHTML=`<div class="card"><h3>💰 IVA</h3><div class="kpiRow"><div class="kpi"><small>NETO DOCUMENTAL</small><b>$ ${money(i.neto)}</b></div><div class="kpi"><small>IVA</small><b>$ ${money(i.iva)}</b></div><div class="kpi"><small>TOTAL</small><b>$ ${money(i.total)}</b></div><div class="kpi"><small>DOCUMENTOS</small><b>${i.docs.toLocaleString('es-CL')}</b></div></div></div>`}
function renderAdmin(){$('content').innerHTML=`<div class="card"><h3>⚙️ Administración</h3><div class="infoGrid"><div class="info"><small>Usuario</small><b>${esc(state.user)}</b></div><div class="info"><small>Rol</small><b>${state.role}</b></div><div class="info"><small>Archivo</small><b>${esc(state.snapshot?.fileName||'Sin cargar')}</b></div><div class="info"><small>Hojas</small><b>${state.snapshot?.sheets?.length||0}</b></div><div class="info"><small>Versión</small><b>STATIC / Other · V8</b></div><div class="info"><small>Sesión</small><b>Activa</b></div></div><div class="toolbar" style="margin-top:14px"><button class="secondary" type="button" onclick="show('maestro')">Administrar Maestro</button><button class="secondary" type="button" onclick="show('private')">Ver indicadores privados</button><button class="danger" type="button" onclick="logout()">Cerrar sesión</button></div></div>`}
function idb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function saveSnapshot(snap){try{const db=await idb();const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(snap,'current');await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){console.warn('IndexedDB no disponible',e)}}
async function readSnapshot(){try{const db=await idb();return await new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).get('current');r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}catch{return null}}
async function deleteSnapshot(){try{const db=await idb();db.transaction(STORE,'readwrite').objectStore(STORE).delete('current')}catch{}}
function loadWorker(){return new Worker('excel-worker.js')}
function processBuffer(file){return new Promise(async(resolve,reject)=>{const worker=loadWorker();worker.onmessage=e=>{const m=e.data;if(m.type==='progress'){setLoading(true,'Procesando Excel…',m.message,m.percent)}else if(m.type==='result'){worker.terminate();resolve(m.snapshot)}else if(m.type==='error'){worker.terminate();reject(new Error(m.message))}};worker.onerror=e=>{worker.terminate();reject(new Error('No fue posible procesar el Excel en segundo plano.'))};try{const buf=await file.arrayBuffer();worker.postMessage({type:'parse',buffer:buf,fileName:file.name},[buf])}catch(e){worker.terminate();reject(e)}})}
async function loadExcel(file){setLoading(true,'Procesando Excel…','Preparando archivo',2);try{const snap=await processBuffer(file);state.snapshot=snap;setLoading(true,'Guardando Maestro…','Preparando índices locales',95);await saveSnapshot(snap);setLoading(false);state.search={};state.page=1;show('dashboard')}catch(e){setLoading(false);$('content').innerHTML=`<div class="card"><h3>⚠️ No se pudo cargar el Excel</h3>${status(esc(e.message||String(e)),'err')}<p class="note">Puedes intentarlo nuevamente sin perder el Maestro anterior.</p></div>`}}
async function login(){const rut=normalize($('userRut').value),pin=$('userPin').value; $('loginError').classList.add('hidden');if(!rut)return $('loginError').textContent='Ingresa un RUT o usuario.',$('loginError').classList.remove('hidden');if(pin!==ACCESS_KEY)return $('loginError').textContent='Clave incorrecta. La clave es 1234 en esta versión.',$('loginError').classList.remove('hidden');state.user=rut;state.role=rut===ADMIN_RUT?'ADMIN':'OPERADOR';try{$('rememberUser').checked?localStorage.setItem('molino_user',$('userRut').value.trim()):localStorage.removeItem('molino_user')}catch{};$('loginScreen').classList.add('hidden');$('app').classList.remove('hidden');$('userLabel').textContent=rut;$('roleLabel').textContent=state.role;buildNav();state.snapshot=await readSnapshot();show('dashboard')}
function logout(){state.user='';state.role='OPERADOR';$('app').classList.add('hidden');$('loginScreen').classList.remove('hidden');$('userPin').value=''}
async function boot(){try{const s=await readSnapshot();if(s)state.snapshot=s}catch(e){console.warn(e)}buildNav();try{const saved=localStorage.getItem('molino_user');if(saved)$('userRut').value=saved}catch{};show('dashboard')}
$('loginForm').addEventListener('submit',e=>{e.preventDefault();login()});$('logoutBtn').addEventListener('click',logout);boot();
})();
</script>
</body></html>
