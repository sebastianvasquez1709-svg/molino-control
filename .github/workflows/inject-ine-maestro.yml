name: Integrate Maestro INE engine

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inject-ine-maestro.yml'
      - 'ine-engine-maestro.js'
      - 'ine-maestro-static.json'
      - 'scripts/inject-ine-maestro.js'
      - 'scripts/patch-ine-maestro-fallback.js'
      - 'scripts/patch-ine-engine-fallback.js'
      - 'scripts/patch-ine-engine-input.js'
      - 'scripts/patch-dispatch-print.js'
      - 'scripts/patch-dispatch-print-v3.js'
      - 'scripts/harden-runtime.js'
      - 'scripts/smoke-integrity.js'
      - 'index.html'
      - 'app.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch INE engine fallback
        run: node scripts/patch-ine-engine-fallback.js

      - name: Patch Registro de Existencia detector
        run: node scripts/patch-ine-engine-input.js

      - name: Patch despacho e impresión A4
        run: node scripts/patch-dispatch-print.js

      - name: Patch impresión Chrome-safe
        run: node scripts/patch-dispatch-print-v3.js

      - name: Apply runtime hardening
        run: node scripts/harden-runtime.js

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check ine-engine-maestro.js
          node --check scripts/harden-runtime.js
          node --check scripts/patch-dispatch-print.js
          node --check scripts/patch-dispatch-print-v3.js
          node --check scripts/smoke-integrity.js

      - name: Validate static Maestro JSON
        run: node -e "JSON.parse(require('fs').readFileSync('ine-maestro-static.json','utf8')); console.log('Maestro JSON OK')"

      - name: Run application integrity smoke test
        run: node scripts/smoke-integrity.js

      - name: Validate dispatch print source
        run: node - <<'NODE'
const fs = require('fs');
const app = fs.readFileSync('app.js','utf8');
const required = [
  'function makePrintHtml(rows,from,to,logo){',
  'table-layout:fixed',
  'overflow-wrap:anywhere',
  '<colgroup>',
  'REPARTOS / PLANILLA DE DESPACHOS',
  '// DISPATCH_PRINT_V2_STATE_SAFE',
  '// DISPATCH_PRINT_V3_CHROME_SAFE',
  'window.printDispatchPlan=()=>{',
  "document.createElement('iframe')",
  'frame.srcdoc=html',
  "frame.setAttribute('sandbox','allow-modals')",
  "frame.setAttribute('allow','modals')"
];
for (const marker of required) if (!app.includes(marker)) throw new Error('Falta marcador de impresión: '+marker);
if (/class=\\\\"num\\\\"/.test(app)) throw new Error('Persisten escapes de comillas defectuosos en la impresión.');
if (/window\.printDispatchPlan[\s\S]{0,5000}location\.reload\(\)/.test(app)) throw new Error('El flujo de impresión aún puede recargar la aplicación.');
console.log('DISPATCH PRINT V3 CHECK: PASS');
NODE

      - name: Patch app shell
        run: node scripts/inject-ine-maestro.js

      - name: Commit patch if needed
        run: |
          if git diff --quiet -- index.html ine-engine-maestro.js app.js; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ine-engine-maestro.js app.js
          git commit -m 'fix: make dispatch printing Chrome-safe without leaving module [skip ci]'
          git push
