name: Integrate Maestro INE engine

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inject-ine-maestro.yml'
      - 'ine-engine-maestro.js'
      - 'ine-maestro-static.json'
      - 'scripts/inject-ine-maestro.js'
      - 'scripts/patch-ine-engine-fallback.js'
      - 'scripts/patch-ine-engine-input.js'
      - 'scripts/harden-runtime.js'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch INE engine fallback
        run: node scripts/patch-ine-engine-fallback.js

      - name: Patch Registro de Existencia detector
        run: node scripts/patch-ine-engine-input.js

      - name: Apply runtime hardening
        run: node scripts/harden-runtime.js

      - name: Validate JavaScript syntax
        run: |
          node --check ine-engine-maestro.js
          node --check scripts/harden-runtime.js

      - name: Validate static Maestro JSON
        run: node -e "JSON.parse(require('fs').readFileSync('ine-maestro-static.json','utf8')); console.log('Maestro JSON OK')"

      - name: Patch app shell
        run: node scripts/inject-ine-maestro.js

      - name: Commit patch if needed
        run: |
          if git diff --quiet -- index.html ine-engine-maestro.js; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ine-engine-maestro.js
          git commit -m 'build: apply non-breaking runtime hardening [skip ci]'
          git push
