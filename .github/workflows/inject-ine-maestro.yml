name: Integrate Maestro INE engine

on:
  push:
    branches: [main]
    paths:
      - 'ine-engine-maestro.js'
      - 'scripts/inject-ine-maestro.js'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch app shell
        run: node scripts/inject-ine-maestro.js

      - name: Commit patch if needed
        run: |
          if git diff --quiet -- index.html; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'build: wire Maestro INE engine into app shell [skip ci]'
          git push
