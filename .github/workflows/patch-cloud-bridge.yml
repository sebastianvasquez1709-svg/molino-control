name: Patch Molino Cloud Bridge
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'chore: finalize Molino cloud bridge')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch application
        shell: python
        run: |
          from pathlib import Path
          APP=Path('app.js'); INDEX=Path('index.html')
          text=APP.read_text(encoding='utf-8')
          if '// CLOUD_BRIDGE_V1' not in text:
              start=text.index('async function readSnapshot(){')
              end=text.index('async function audit',start)
              original=text[start:end]
              local_fn=original.replace('async function readSnapshot()','async function readSnapshotLocal()',1)
              text=text[:start]+local_fn+text[end:]
              start=text.index('async function readSnapshotLocal(){')
              end=text.index('async function audit',start)
              cloud_read="""async function readSnapshot(){
                try{
                  if(window.MolinoCloud && await MolinoCloud.getSession()) return await MolinoCloud.snapshot({force:true});
                }catch(e){ console.warn('Cloud snapshot no disponible; usando almacenamiento local',e); }
                return await readSnapshotLocal();
              }
              """
              text=text[:start]+cloud_read+text[end:]
              start=text.index('async function login(){')
              end=text.index('function logout',start)
              login="""async function login(){
                const rut=normalize($('userRut').value),pin=$('userPin').value;
                $('loginError').classList.add('hidden');
                if(!rut){$('loginError').textContent='Ingresa un RUT o usuario.';$('loginError').classList.remove('hidden');return;}
                if(!pin){$('loginError').textContent='Ingresa tu clave.';$('loginError').classList.remove('hidden');return;}
                try{
                  const session=await MolinoCloud.signIn(rut,pin);
                  state.user=session.user.rut||rut; state.role=session.user.role||'OPERADOR';
                  try{$('rememberUser').checked?localStorage.setItem('molino_user',$('userRut').value.trim()):localStorage.removeItem('molino_user')}catch{}
                  $('loginScreen').classList.add('hidden');$('app').classList.remove('hidden');
                  $('userLabel').textContent=state.user;$('roleLabel').textContent=state.role;buildNav();
                  state.snapshot=await MolinoCloud.snapshot({force:true});applyClientContacts();
                  state.ineMonths=await readIneMonths();state.existenceRecords=await readExistenceRecords();state.existenceBaseRecords=await readExistenceBaseRecords();show('dashboard');
                }catch(e){$('loginError').textContent=e?.message||'No fue posible conectar con Supabase.';$('loginError').classList.remove('hidden');}
              }
              """
              text=text[:start]+login+text[end:]
              start=text.index('function logout(){')
              end=text.index('window.logout',start)
              logout="""function logout(){
                Promise.resolve(MolinoCloud?.signOut?.()).catch(e=>console.warn(e));
                state.user='';state.role='OPERADOR';state.snapshot=null;
                $('app').classList.add('hidden');$('loginScreen').classList.remove('hidden');$('userPin').value='';
              }
              """
              text=text[:start]+logout+text[end:]
              text=text.replace('const check=await readSnapshot();if(!check||check.fileName!==snap.fileName)','const check=await readSnapshotLocal();if(!check||check.fileName!==snap.fileName)')
              text=text.replace('await saveSnapshot(legacy);return await readSnapshot()','await saveSnapshot(legacy);return await readSnapshotLocal()')
              text='// CLOUD_BRIDGE_V1\n'+text
              APP.write_text(text,encoding='utf-8')
          html=INDEX.read_text(encoding='utf-8')
          if '/molino-cloud.js' not in html:
              html=html.replace('<script src="app.js"></script>','<script src="/molino-cloud.js"></script>\n<script src="app.js"></script>')
              INDEX.write_text(html,encoding='utf-8')
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check molino-cloud.js
      - name: Commit patched application
        run: |
          git config user.name 'Molino Control Bot'
          git config user.email 'molino-control-bot@users.noreply.github.com'
          git add app.js index.html
          git commit -m 'chore: finalize Molino cloud bridge' || exit 0
          git push