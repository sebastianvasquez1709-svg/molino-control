<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Molino Control · Diagnóstico</title>
<style>
body{margin:0;padding:28px;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f4f7fb;color:#1d2939}
main{max-width:900px;margin:auto;background:#fff;border:1px solid #d9e2ef;border-radius:16px;padding:24px;box-shadow:0 16px 40px rgba(18,58,120,.08)}
h1{margin:0;color:#123a78}p{color:#667085}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.card{padding:16px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px}.k{font-size:12px;color:#667085}.v{font-size:24px;font-weight:800;color:#123a78;margin-top:4px}.ok{color:#067647}.bad{color:#b42318}.muted{color:#667085;font-size:12px}button{border:0;background:#123a78;color:#fff;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;background:#0b0f14;color:#dbe5f0;padding:14px;border-radius:10px;min-height:100px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>Molino Control · Diagnóstico</h1>
<p>Verificación independiente de la capa pública de salud del Maestro. No expone filas ni datos comerciales.</p>
<button id="refresh">Actualizar diagnóstico</button>
<div id="status" class="muted" style="margin-top:12px">Esperando…</div>
<div id="grid" class="grid"></div>
<pre id="raw">Sin datos.</pre>
</main>
<script src="maestro-health.js"></script>
<script>
const $=id=>document.getElementById(id);
function card(label,value){return `<div class="card"><div class="k">${label}</div><div class="v">${value}</div></div>`}
async function refresh(){
  $('status').textContent='Consultando Supabase…';
  $('grid').innerHTML=''; $('raw').textContent='';
  try{
    const d=await window.MolinoMaestroHealth.maestroHealth();
    $('status').innerHTML=d.ok&&d.available?'<span class="ok"><b>● Sistema disponible</b></span>':'<span class="bad"><b>● Sin importación disponible</b></span>';
    $('grid').innerHTML = d.available ? [
      card('Estado',d.status||'—'),
      card('Filas fuente',(d.source_rows??0).toLocaleString('es-CL')),
      card('BASE DE DATOS',(d.base_rows??0).toLocaleString('es-CL')),
      card('Hojas',(d.sheets??0).toLocaleString('es-CL')),
      card('Archivo',d.file||'—'),
      card('Última actualización',d.updated_at?new Date(d.updated_at).toLocaleString('es-CL'):'—')
    ].join('') : '';
    $('raw').textContent=JSON.stringify(d,null,2);
  }catch(e){
    $('status').innerHTML=`<span class="bad"><b>● Error:</b> ${e.message}</span>`;
    $('raw').textContent=String(e.stack||e);
  }
}
$('refresh').addEventListener('click',refresh); refresh();
</script>
</body>
</html>
