<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Molino Control</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb}iframe{display:block;width:100%;height:100%;border:0}</style></head>
<body>
<iframe id="appFrame" src="/index.html" title="Molino Control"></iframe>
<script>
(()=>{
  const frame=document.getElementById('appFrame');
  frame.addEventListener('load',()=>{
    try{
      const doc=frame.contentDocument;
      if(!doc||doc.getElementById('autoV6Injected'))return;
      const marker=doc.createElement('meta');marker.id='autoV6Injected';doc.head.appendChild(marker);
      const s5=doc.createElement('script');s5.src='/ine-sacos-granel-automatico-v5.js';doc.body.appendChild(s5);
      const s6=doc.createElement('script');s6.src='/ine-sacos-granel-automatico-v6.js';doc.body.appendChild(s6);
    }catch(e){console.error('Automatic module injection failed',e)}
  });
})();
</script>
</body></html>
