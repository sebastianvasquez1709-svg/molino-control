<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Molino Control</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb}iframe{display:block;width:100%;height:100%;border:0}</style></head>
<body>
<iframe id="appFrame" src="/index.html" title="Molino Control"></iframe>
<script>
(()=>{
  const frame=document.getElementById('appFrame');
  frame.addEventListener('load',()=>{
    try{
      const doc=frame.contentDocument;
      if(!doc||doc.getElementById('autoV11Injected'))return;
      const marker=doc.createElement('meta');marker.id='autoV11Injected';doc.head.appendChild(marker);
      const s5=doc.createElement('script');s5.src='/ine-sacos-granel-automatico-v9.js?v=excel-format-v10';doc.body.appendChild(s5);
      const s10=doc.createElement('script');s10.src='/ine-sacos-granel-automatico-v10.js?v=excel-format-v10';doc.body.appendChild(s10);
      const s11=doc.createElement('script');s11.src='/molino-ine-exact-v11.js?v=master-ine-exact-v11';doc.body.appendChild(s11);
    }catch(e){console.error('Excel V11 injection failed',e)}
  });
})();
</script>
</body></html>
